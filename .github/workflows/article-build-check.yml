name: Article build check

on:
  push:
    branches:
      - feature/article-generator-foundation
    paths:
      - "content/articles/**"
      - "templates/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/article-build-check.yml"

  pull_request:
    branches:
      - main
    paths:
      - "content/articles/**"
      - "templates/**"
      - "scripts/**"
      - "requirements.txt"

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate article data
        run: python scripts/validate_articles.py

      - name: Build article preview
        run: python scripts/build_site.py

      - name: Upload generated preview
        uses: actions/upload-artifact@v4
        with:
          name: article-preview
          path: preview/
          if-no-files-found: error

      - name: Select latest editorial draft
        id: release
        shell: bash
        run: |
          ARTICLE_PATH="$(git log -1 --format= --name-only -- 'content/articles/*.md' | sed '/^$/d' | head -1)"
          test -n "$ARTICLE_PATH"
          SLUG="$(sed -n 's/^slug:[[:space:]]*//p' "$ARTICLE_PATH" | head -1 | tr -d '"')"
          test -n "$SLUG"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Prepare production release artifact
        run: python scripts/prepare_article_release.py "${{ steps.release.outputs.slug }}"

      - name: Upload production release artifact
        uses: actions/upload-artifact@v4
        with:
          name: article-release-${{ steps.release.outputs.slug }}
          path: release/
          if-no-files-found: error
