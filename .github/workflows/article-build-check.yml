name: Article build check

on:
  push:
    branches:
      - feature/article-generator-foundation
    paths:
      - "content/articles/**"
      - "templates/**"
      - "scripts/**"
      - "requirements.txt"
      - "admin/**"
      - ".github/workflows/article-build-check.yml"

  pull_request:
    branches:
      - main
    paths:
      - "content/articles/**"
      - "templates/**"
      - "scripts/**"
      - "requirements.txt"
      - "admin/**"

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Build editorial admin
        working-directory: admin
        run: npm run build

      - name: Validate article data
        run: python scripts/validate_articles.py

      - name: Build article preview
        run: python scripts/build_site.py

      - name: Upload generated preview
        uses: actions/upload-artifact@v4
        with:
          name: article-preview
          path: preview/
          if-no-files-found: warn

      - name: Select latest editorial draft
        id: release
        shell: bash
        run: |
          ARTICLE_PATH="$(
            for file in content/articles/*.md; do
              grep -q '^draft: true' "$file" || continue
              printf '%s\t%s\n' "$(git log -1 --format=%ct -- "$file")" "$file"
            done | sort -k1,1nr -k2,2r | head -1 | cut -f2-
          )"
          if [ -z "$ARTICLE_PATH" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SLUG="$(sed -n 's/^slug:[[:space:]]*//p' "$ARTICLE_PATH" | head -1 | tr -d '"')"
          test -n "$SLUG"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Prepare production release artifact
        if: steps.release.outputs.available == 'true'
        run: python scripts/prepare_article_release.py "${{ steps.release.outputs.slug }}"

      - name: Upload production release artifact
        if: steps.release.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: article-release-${{ steps.release.outputs.slug }}
          path: release/
          if-no-files-found: error
